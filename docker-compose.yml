name: nextwave

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nextwave}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nextwave-dev}
    ports:
      - "5672:5672"    # el bus
      - "15672:15672"  # consola web: guest / guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_port_connectivity, NO "ping": ping solo dice que el nodo Erlang
      # esta vivo, y el listener AMQP del 5672 tarda mas en levantar. Con ping
      # el backend arranca contra un rabbit que todavia rechaza conexiones.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  # el sistema administrativo de la empresa (facturas y remitos). Servicio
  # aparte a proposito: el agente lo consulta como consultaria un ERP externo.
  facturacion:
    build: ./facturacion
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nextwave}:${RABBITMQ_PASSWORD:-nextwave-dev}@rabbitmq:5672/
      DB_PATH: /data/nextwave.db
      # sin esto la demo llamaria por telefono de verdad y gastaria plata
      SIMULATE_CALLS: ${SIMULATE_CALLS:-1}
      SIMULATE_DISPATCH: ${SIMULATE_DISPATCH:-1}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      VALIDATE_TWILIO_SIGNATURE: ${VALIDATE_TWILIO_SIGNATURE:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      FACTURACION_URL: ${FACTURACION_URL:-http://facturacion:8100}
      DETECCION_AUTOMATICA: ${DETECCION_AUTOMATICA:-0}
      VOICE_MODE: ${VOICE_MODE:-gather}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}
      REALTIME_VOICE: ${REALTIME_VOICE:-marin}
      AGENT_NAME: ${AGENT_NAME:-Marina}
      REALTIME_SPEED: ${REALTIME_SPEED:-1.25}
      REALTIME_EAGERNESS: ${REALTIME_EAGERNESS:-low}
      INTERRUPT_AFTER_S: ${INTERRUPT_AFTER_S:-3.0}
      NOISE_GATE: ${NOISE_GATE:-0.02}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-NextWave <onboarding@resend.dev>}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      DEMO_WORKER_PHONE: ${DEMO_WORKER_PHONE:-+5491100000000}
    volumes:
      - ./backend/app:/srv/app   # editar codigo local se refleja adentro
      - ./backend/sim:/srv/sim
      - nextwave-data:/data      # la SQLite sobrevive a docker compose down
    # timeout-graceful-shutdown: sin esto, un websocket abierto (la pagina
    # /dev/voz) deja el reload colgado en "waiting for background tasks" y el
    # backend queda sin responder
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --timeout-graceful-shutdown 5
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      facturacion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  ngrok:
    image: ngrok/ngrok:3-alpine
    profiles: ["voice"]
    command: ["http", "--domain=${NGROK_DOMAIN:-CHANGEME.ngrok-free.app}", "backend:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nextwave-data:
  redis-data:
  rabbitmq-data:
