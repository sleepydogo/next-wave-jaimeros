name: nextwave

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # el bus
      - "15672:15672"  # consola web: guest / guest
    healthcheck:
      # check_port_connectivity, NO "ping": ping solo dice que el nodo Erlang
      # esta vivo, y el listener AMQP del 5672 tarda mas en levantar. Con ping
      # el backend arranca contra un rabbit que todavia rechaza conexiones.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DB_PATH: /data/nextwave.db
      # sin esto la demo llamaria por telefono de verdad y gastaria plata
      SIMULATE_CALLS: "1"
      PUBLIC_URL: http://localhost:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    volumes:
      - ./backend/app:/srv/app   # editar codigo local se refleja adentro
      - ./backend/sim:/srv/sim
      - nextwave-data:/data      # la SQLite sobrevive a docker compose down
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nextwave-data:
